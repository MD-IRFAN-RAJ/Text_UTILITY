<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TextUtils - Text Analysis Tool</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --secondary: #f8fafc;
            --dark: #1e293b;
            --light: #f1f5f9;
            --text: #334155;
            --text-light: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --radius: 12px;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light);
            color: var(--text);
            line-height: 1.6;
            transition: var(--transition);
        }

        body.dark-mode {
            background-color: #0f172a;
            color: #e2e8f0;
            --secondary: #1e293b;
            --light: #0f172a;
            --text: #e2e8f0;
            --text-light: #94a3b8;
            --border: #334155;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* Header Styles */
        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .logo i {
            font-size: 1.75rem;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            transition: var(--transition);
        }

        .nav-links a:hover, .nav-links a.active {
            background-color: rgba(255, 255, 255, 0.15);
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .search-container {
            position: relative;
        }

        .search-container i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
        }

        .search-input {
            padding: 0.5rem 1rem 0.5rem 2.5rem;
            border: none;
            border-radius: 6px;
            background-color: rgba(255, 255, 255, 0.9);
            width: 200px;
            transition: var(--transition);
        }

        .search-input:focus {
            outline: none;
            width: 250px;
            background-color: white;
        }

        .dark-mode-toggle {
            background: none;
            border: none;
            color: white;
            font-size: 1.25rem;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 6px;
            transition: var(--transition);
        }

        .dark-mode-toggle:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }

        /* Main Content */
        .main-content {
            padding: 2rem 0;
        }

        .card {
            background-color: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            transition: var(--transition);
        }

        body.dark-mode .card {
            background-color: #1e293b;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        body.dark-mode .card-title {
            color: #e2e8f0;
        }

        .text-input {
            width: 100%;
            min-height: 200px;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            resize: vertical;
            font-size: 1rem;
            transition: var(--transition);
            background-color: var(--secondary);
        }

        body.dark-mode .text-input {
            background-color: #334155;
            border-color: #475569;
            color: #e2e8f0;
        }

        .text-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin: 1.5rem 0;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: var(--secondary);
            color: var(--text);
            border: 1px solid var(--border);
        }

        body.dark-mode .btn-secondary {
            background-color: #334155;
            color: #e2e8f0;
            border-color: #475569;
        }

        .btn-secondary:hover {
            background-color: var(--light);
        }

        body.dark-mode .btn-secondary:hover {
            background-color: #475569;
        }

        .btn-success {
            background-color: var(--success);
            color: white;
        }

        .btn-success:hover {
            background-color: #0da271;
            transform: translateY(-2px);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            background-color: var(--secondary);
            padding: 1rem;
            border-radius: var(--radius);
            margin: 1.5rem 0;
            flex-wrap: wrap;
            gap: 1rem;
        }

        body.dark-mode .stats {
            background-color: #334155;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        body.dark-mode .stat-value {
            color: #818cf8;
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--text-light);
        }

        .preview {
            background-color: var(--secondary);
            padding: 1rem;
            border-radius: var(--radius);
            min-height: 100px;
            border: 1px dashed var(--border);
            margin-top: 1rem;
        }

        body.dark-mode .preview {
            background-color: #334155;
            border-color: #475569;
        }

        /* Footer */
        footer {
            background-color: var(--dark);
            color: white;
            padding: 2rem 0;
            margin-top: 2rem;
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .footer-links {
            display: flex;
            gap: 1.5rem;
        }

        .footer-links a {
            color: var(--text-light);
            text-decoration: none;
            transition: var(--transition);
        }

        .footer-links a:hover {
            color: white;
        }

        .copyright {
            color: var(--text-light);
            font-size: 0.875rem;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 1rem;
            }
            
            .nav-links {
                gap: 1rem;
            }
            
            .search-input {
                width: 150px;
            }
            
            .search-input:focus {
                width: 180px;
            }
            
            .action-buttons {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
                justify-content: center;
            }
            
            .stats {
                flex-direction: column;
                align-items: center;
            }
            
            .footer-content {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <nav class="navbar">
                <div class="logo">
                    <i class="fas fa-text-height"></i>
                    <span>TextUtils</span>
                </div>
                <ul class="nav-links">
                    <li><a href="#" class="active">Home</a></li>
                    <li><a href="./aboutus.html">About Us</a></li>
                </ul>
                <div class="nav-controls">
                    <div class="search-container">
                        <i class="fas fa-search"></i>
                        <input type="text" class="search-input" placeholder="Search">
                    </div>
                    <button class="dark-mode-toggle" id="darkModeToggle">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="card">
                <h2 class="card-title">
                    <i class="fas fa-edit"></i>
                    Enter the text to analyze
                </h2>
                <textarea class="text-input" id="textInput" placeholder="Type or paste your text here..."></textarea>
                
                <div class="action-buttons">
                    <button class="btn btn-primary" id="upperCaseBtn">
                        <i class="fas fa-text-height"></i>
                        Convert to UPPERCASE
                    </button>
                    <button class="btn btn-primary" id="lowerCaseBtn">
                        <i class="fas fa-text-height"></i>
                        Convert to lowercase
                    </button>
                    <button class="btn btn-success" id="readAloudBtn">
                        <i class="fas fa-volume-up"></i>
                        Read aloud
                    </button>
                </div>
                
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-value" id="charCount">0</span>
                        <span class="stat-label">Characters</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="wordCount">0</span>
                        <span class="stat-label">Words</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="readTime">0.008</span>
                        <span class="stat-label">Minutes to read</span>
                    </div>
                </div>
                
                <h2 class="card-title">
                    <i class="fas fa-eye"></i>
                    Preview
                </h2>
                <div class="preview" id="preview">
                    Your output will appear here...
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="logo">
                    <i class="fas fa-text-height"></i>
                    <span>TextUtils</span>
                </div>
                <div class="footer-links">
                    <a href="/index.html">Home</a>
                    <a href="./aboutus.html">About Us</a>
                </div>
                <div class="copyright">
                    &copy; 2025 TextUtils. All rights reserved. Made with <i class="fas fa-heart" style="color: #ef4444;"></i>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // DOM Elements
        const textInput = document.getElementById('textInput');
        const upperCaseBtn = document.getElementById('upperCaseBtn');
        const lowerCaseBtn = document.getElementById('lowerCaseBtn');
        const readAloudBtn = document.getElementById('readAloudBtn');
        const charCount = document.getElementById('charCount');
        const wordCount = document.getElementById('wordCount');
        const readTime = document.getElementById('readTime');
        const preview = document.getElementById('preview');
        const darkModeToggle = document.getElementById('darkModeToggle');

        // Update character and word count
        textInput.addEventListener('input', updateStats);

        function updateStats() {
            const text = textInput.value;
            const charCountValue = text.length;
            const wordCountValue = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
            const readTimeValue = (wordCountValue / 200).toFixed(3);
            
            charCount.textContent = charCountValue;
            wordCount.textContent = wordCountValue;
            readTime.textContent = readTimeValue;
            
            preview.textContent = text || 'Your output will appear here...';
        }

        // Convert to uppercase
        upperCaseBtn.addEventListener('click', function() {
            textInput.value = textInput.value.toUpperCase();
            updateStats();
        });

        // Convert to lowercase
        lowerCaseBtn.addEventListener('click', function() {
            textInput.value = textInput.value.toLowerCase();
            updateStats();
        });

        // Read aloud functionality
        readAloudBtn.addEventListener('click', function() {
            const text = textInput.value;
            if (text.trim() === '') {
                alert('Please enter some text to read aloud.');
                return;
            }
            
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                window.speechSynthesis.speak(utterance);
            } else {
                alert('Your browser does not support text-to-speech functionality.');
            }
        });

        // Dark mode toggle
        darkModeToggle.addEventListener('click', function() {
            document.body.classList.toggle('dark-mode');
            const icon = darkModeToggle.querySelector('i');
            if (document.body.classList.contains('dark-mode')) {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            } else {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            }
        });

        // Initialize stats
        updateStats();
    </script>
</body>
</html>
